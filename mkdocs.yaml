site_name: Open AD Kit
site_description: "The deployment layer for the Autoware ecosystem: packaging its software into reproducible deployments, built for the path from simulation to in-vehicle systems."
site_url: https://autowarefoundation.github.io/openadkit/
repo_url: https://github.com/autowarefoundation/openadkit
edit_uri: edit/main/docs/
docs_dir: docs
strict: true
# With strict mode, a link to a missing #anchor fails the build.
validation:
  links:
    anchors: warn
copyright: Copyright &copy; 2026 The Autoware Foundation

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.copy
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.suggest
  favicon: assets/images/autoware-foundation.png
  logo: assets/images/autoware-foundation.png
  icon:
    repo: fontawesome/brands/github
  language: en
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: light-blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode

extra_css:
  - assets/css/extra.css

# Snippets, the macros module and the theme overrides are no pages.
exclude_docs: |
  /includes/
  /macros.py
  /requirements.txt
  /overrides/
  __pycache__/

plugins:
  - macros:
      # docs/macros.py: variables + catalog-generated tables.
      module_name: docs/macros
      on_error_fail: true
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - mdx_truly_sane_lists
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: "#"
      toc_depth: 3
      title: "On this page"

nav:
  - Introduction:
      - index.md
      - Glossary: glossary.md
  - Getting Started:
      - getting-started/index.md
      - CLI & Maintenance: getting-started/cli.md
      - Troubleshooting: getting-started/troubleshooting.md
  - Deployments:
      - deployments/index.md
      - Planning Simulation: deployments/planning-simulation.md
      - Scenario Simulation: deployments/scenario-simulation.md
      - Logging Simulation: deployments/logging-simulation.md
      - CARLA Simulation: deployments/carla-simulation.md
      - Safety Island Simulation: deployments/safety-island-simulation.md
      - Split-host Simulation: deployments/split-host.md
      - Components: deployments/components.md
  - Kits:
      - Create a Kit: kits/create-a-kit.md
      - Develop and Debug: kits/develop-and-debug.md
      - Kit Guide: kits/kit-guide.md
  - Platforms:
      - platforms/index.md
      - AutoSD: platforms/autosd.md
  - Releases:
      - releases/index.md
      - Container Images: releases/container-images.md
      - Compatibility: releases/compatibility.md
      - Evidence Policy: releases/evidence.md
      - Verify a Release: releases/verification.md
  - Development:
      - Build from Source: development/build-from-source.md
      - Release Process: development/release-process.md
