<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 404" width="1000" height="404" role="img" aria-labelledby="title desc">
  <title id="title">One command starts Autoware as separate containers</title>
  <desc id="desc">openadkit run planning-simulation starts the localization-mapping, planning, control, vehicle-system, simulator, visualizer and api images as containers that talk over ROS 2. The sensing-perception image and the Safety Island belong to other deployments.</desc>
