<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 444" width="1000" height="444" role="img" aria-labelledby="title desc">
  <title id="title">One command starts Autoware as separate containers</title>
  <desc id="desc">openadkit run planning-simulation starts localization-mapping, planning, control, vehicle-system, simulator, visualizer and api as containers that talk over ROS 2. The sensing-perception image and the Safety Island belong to other deployments. Caption: one reproducible path from simulation to in-vehicle systems.</desc>
