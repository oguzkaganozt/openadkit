# The CI fixture's services on top of what `openadkit new example-kit` made:
# Planning Simulation and the kit's own services (extension point 4).
include:
  - ${OPENADKIT_BASE_DEPLOYMENT}/compose.yaml

services:
  heartbeat:
    # A kit's external image (extension point 5), pinned in its openadkit.json.
    image: ${HEARTBEAT_IMAGE:?pinned in openadkit.json externalImages}
    network_mode: none
    init: true
    command: ["sleep", "infinity"]
    restart: unless-stopped

  acme-probe:
    # The kit's own C++ node from overlay_ws (extension point 3), built by
    # openadkit build. It runs in an Open AD Kit runtime image, whose
    # entrypoint hook sources the overlay workspace mounted below.
    # What every Autoware service shares: host network, DDS settings, config overrides
    # and the overlay workspace.
    extends:
      file: ${OPENADKIT_ROOT}/deployments/shared/services/autoware.yaml
      service: autoware
    image: ${PLANNING_IMAGE:?set by the openadkit CLI}
    volumes:
      - ./checks:/openadkit/checks:ro
    command: ros2 run acme_probe probe
    # This kit's readiness, which `openadkit run` waits for (checks/example_kit.py).
    healthcheck:
      test: ["CMD-SHELL", ". /opt/ros/${ROS_DISTRO}/setup.sh && . /opt/autoware/setup.sh && exec python3 /openadkit/checks/example_kit.py"]
      start_period: 10m
      start_interval: 5s
      interval: 1m
      timeout: 90s
      retries: 3
    restart: on-failure
