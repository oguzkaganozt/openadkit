# Bug Report Template
name: Bug
description: Report a bug
body:
  - type: textarea
    attributes:
      label: Description
      description: Write a brief description of the bug.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Write the steps to reproduce the bug.
      placeholder: |-
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Versions
      description: Paste the output of `openadkit version --json`, and name your OS.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Possible causes
      description: Write the possible causes if you have any ideas.
    validations:
      required: false
