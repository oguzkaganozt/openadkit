name: setup-build-env
# Shared build-environment setup for Docker image build jobs.
#
# Encapsulates the Autoware source + Buildx + registry login sequence that is
# identical across build-common, build-components, and build-single-image.
# Each build job must run actions/checkout BEFORE calling this action (GitHub
# needs the repo on disk to resolve the local composite action path).
#
# Usage:
#   - uses: actions/checkout@v7
#   - uses: ./.github/actions/setup-build-env
#     with:
#       autoware-ref: ${{ needs.prepare.outputs.autoware_ref }}
#       build-tag: ${{ needs.prepare.outputs.build_tag }}
#       registry: ${{ env.REGISTRY }}
#       registry-username: ${{ github.actor }}
#       registry-password: ${{ secrets.GITHUB_TOKEN }}

description: Set up build environment (Autoware source, Buildx, registry login)

inputs:
  autoware-ref:
    description: Autoware git ref to checkout (branch, tag, or SHA)
    required: false
    default: main
  build-tag:
    description: Build tag used in lockfile artifact name
    required: false
    default: ""
  registry:
    description: Container registry URL (e.g. ghcr.io)
    required: true
  registry-username:
    description: Registry username
    required: true
  registry-password:
    description: Registry password or token
    required: true
  free-disk:
    description: Whether to free disk space (set to false for lightweight builds)
    required: false
    default: "true"
  setup-autoware:
    description: Whether to checkout Autoware source and pull dependencies
    required: false
    default: "true"
  with-middleware:
    description: Whether to create middleware/external/.keep (needed by universe-common)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # The ARM runner image already has ample space and lacks most of the
    # packages this removes, so its apt-get remove fails with a warning.
    - name: Free Disk Space (Ubuntu)
      if: inputs.free-disk == 'true' && runner.arch == 'X64'
      uses: ./.github/actions/free-disk-space

    - name: Install jq and vcs2l
      if: inputs.setup-autoware == 'true'
      run: |
        # The hosted runner images ship jq and pipx. apt runs only where one is
        # missing, so an outage of the Ubuntu mirror cannot fail the build here.
        if ! command -v jq >/dev/null || ! command -v pipx >/dev/null; then
          sudo apt-get update
          sudo apt-get install -y jq pipx
        fi
        pipx install "vcs2l==1.1.7"
      shell: bash

    - name: Checkout Autoware repository
      if: inputs.setup-autoware == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: autowarefoundation/autoware
        ref: ${{ inputs.autoware-ref }}
        path: autoware
        fetch-depth: 1

    - name: Download Autoware dependency lockfile
      if: inputs.setup-autoware == 'true' && inputs.build-tag != ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: autoware-lock-${{ inputs.build-tag }}
        path: autoware-lock

    - name: Pull Autoware Source
      if: inputs.setup-autoware == 'true'
      run: |
        set -euo pipefail
        mkdir -p autoware/src
        if [ ! -f autoware-lock/autoware-lock.repos ]; then
          echo "Autoware lockfile not found at autoware-lock/autoware-lock.repos" >&2
          echo "This happens when build-tag is empty. Ensure build-tag is set when setup-autoware is true." >&2
          exit 1
        fi
        vcs import --shallow autoware/src < autoware-lock/autoware-lock.repos
        # A release line's backported Autoware fixes (.github/autoware-patches).
        python3 .github/scripts/autoware_patches.py apply autoware/src
        if [ "${{ inputs.with-middleware }}" = "true" ]; then
          # Some Autoware refs do not provide middleware sources, but
          # components/universe-common/Dockerfile bind-mounts this path.
          mkdir -p autoware/src/middleware/external
          touch autoware/src/middleware/external/.keep
        fi
      shell: bash

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to Container Registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}
