name: lint

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '.gitignore'
      - 'openadkit'
      - 'cli/**'
      - 'pyproject.toml'
      - '.github/scripts/evidence/example-kit/**'
      - 'deployments/safety-island-simulation/**'
      - '**/*.sh'
      - '**/*.json'
      - '**/*.json5'
      - '.github/image-inventory.json'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yaml'
      - '.github/stale.yml'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '**/*.md'
      - '**/Dockerfile*'
      - '**/*.dockerfile'
      - '**/compose*.yaml'
      - '**/*.env'
      - 'deployments/**/*.yaml'
      - 'deployments/**/*.yml'
      - 'platforms/**/*.yaml'
      - 'platforms/**/*.yml'
      - 'components/**/*.hcl'
      - 'components/shared/**'
      - '.hadolint.yaml'
      - '.markdownlint.yaml'
      - '.markdownlintignore'
      - '.yamllint.yaml'
      - 'mkdocs.yaml'
      - 'docs/Makefile'
      - 'docs/macros.py'
      - 'docs/requirements.txt'
      - 'docs/assets/**'
      - 'docs/overrides/**'
      - 'docs/**/*.yaml'
      - 'docs/**/*.yml'
      - 'docs/.pages'
      - 'docs/**/.pages'
      - '.github/workflows/lint.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: |
          pip install yamllint pytest ruff mypy
          curl -sSL -o /tmp/actionlint.sh https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash
          bash /tmp/actionlint.sh

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: error

      - name: Run actionlint
        run: ./actionlint

      - name: Run hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile*
          recursive: true
          config: .hadolint.yaml

      - name: Run yamllint
        run: |
          yamllint --format github -c .yamllint.yaml \
            .github/workflows/ \
            .github/actions/ \
            .github/ISSUE_TEMPLATE/ \
            .github/dependabot.yaml \
            .github/stale.yml \
            deployments/ \
            platforms/ \
            mkdocs.yaml \
            docs/

      - name: Run ruff
        run: ruff check --output-format github cli .github/scripts components/shared/entrypoint

      - name: Run mypy
        # Settings and the checked paths live in pyproject.toml.
        run: mypy

      - name: Run markdownlint
        run: npx --yes markdownlint-cli --config .markdownlint.yaml '**/*.md'

      - name: Install Docker Compose v5.2+
        # The ubuntu-latest runner ships an older compose plugin that rejects
        # service overrides after `include:` (used by scenario-simulation).
        # Install the latest release that supports the compose-spec include/merge.
        run: bash .github/scripts/install-compose.sh

      - name: Validate Docker Compose files
        # The cell list comes from the deployment manifests through the same
        # enumerator release_plan.py uses; role cells carry a --role argument.
        # Dummy Zenoh endpoints satisfy role requirement checks only.
        run: |
          set -euo pipefail
          export REMOTE_PASSWORD="${REMOTE_PASSWORD:-ci-validate}"
          export ZENOH_LISTEN="tcp/127.0.0.1:7447"
          export ZENOH_PEER="tcp/127.0.0.1:7447"
          matrix=$(python3 .github/scripts/validation_matrix.py --source-root .)
          while IFS=$'\t' read -r deployment ros_distro gpu role; do
            validate_args=(./openadkit validate "${deployment}" --ros-distro "${ros_distro}")
            if [ "${gpu}" = true ]; then
              validate_args+=(--gpu)
            fi
            if [ -n "${role}" ]; then
              validate_args+=(--role "${role}")
            fi
            "${validate_args[@]}"
          done <<< "${matrix}"

      - name: Validate the example kits made by openadkit new
        env:
          REMOTE_PASSWORD: ci-validate
        run: |
          set -euo pipefail
          python3 .github/scripts/validation_matrix.py --source-root . --make-example-kits "$RUNNER_TEMP/kits" |
            while read -r kit; do
              (cd "${kit}" && "$GITHUB_WORKSPACE/openadkit" validate "$(basename "${kit}")")
            done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Validate bake.hcl parses and COLCON_BASE_PATHS is single-source
        # `docker buildx bake --print` parses the HCL and resolves every target
        # without pulling images. Each CUDA target (<image>-cuda) must produce
        # the same COLCON_BASE_PATHS value as its CPU image: a single source of
        # truth for the package list of both.
        run: |
          set -euo pipefail
          fail=0
          base_paths() {
            docker buildx bake -f components/docker-bake.hcl --print "$1" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["target"][sys.argv[1]]["args"].get("COLCON_BASE_PATHS", ""))' "$1"
          }
          for cuda in $(jq -r '.images[].target | select(endswith("-cuda"))' .github/image-inventory.json); do
            cpu_target=${cuda%-cuda}
            cpu=$(base_paths "${cpu_target}")
            gpu=$(base_paths "${cuda}")
            if [ -z "${cpu}" ] || [ -z "${gpu}" ]; then
              echo "::error::${cpu_target} and ${cuda} must both set COLCON_BASE_PATHS"
              fail=1
            elif [ "${cpu}" != "${gpu}" ]; then
              echo "::error::COLCON_BASE_PATHS diverges between ${cpu_target} and ${cuda}"
              echo "  cpu:  ${cpu}"
              echo "  cuda: ${gpu}"
              fail=1
            fi
          done
          # Validate that the universe-common-devel target parses cleanly (catches
          # locals-blocks, typo'd function names, missing ARGs, etc.).
          docker buildx bake -f components/docker-bake.hcl --print universe-common-devel \
            > /dev/null
          # Repository-mode `./openadkit` looks up
          # <prefix>:<target>-<arch>-<ros-distro>. Every catalog target must
          # carry that local tag so a --load build needs no --set overrides.
          arch=$(uname -m)
          case "${arch}" in
            x86_64|amd64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
          esac
          prefix=$(python3 -c 'import json; print(json.load(open("openadkit.json"))["imageRepository"])')
          distro=$(python3 -c 'import json; print(json.load(open("openadkit.json"))["defaultRosDistro"])')
          for target in $(python3 -c 'import json; print(" ".join(json.load(open("openadkit.json"))["componentImages"].values()))'); do
            expected="${prefix}:${target}-${arch}-${distro}"
            tags=$(docker buildx bake -f components/docker-bake.hcl --print "${target}" \
              | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)["target"][sys.argv[1]].get("tags", [])))' "${target}")
            case " ${tags} " in
              *" ${expected} "*) ;;
              *)
                echo "::error::${target} is missing local tag ${expected}"
                fail=1
                ;;
            esac
          done
          exit "${fail}"

      - name: Smoke-test Dockerized docs build
        run: |
          make -C docs build
          test -f site/index.html

      - name: Check the docs-site links in READMEs against the built site
        run: python3 .github/scripts/check_site_links.py

      - name: Run Python tests
        run: pytest .github/scripts/

      - name: Run shell tests
        run: |
          bash .github/actions/combine-multi-arch-images/test-create-manifest.sh
          bash .github/scripts/tests/test_setup_helpers.sh
