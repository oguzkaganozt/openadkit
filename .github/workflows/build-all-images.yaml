name: build-all-images

on:
  push:
    branches:
      - '**'
    paths:
      - '.github/actions/combine-multi-arch-images/**'
      - '.github/actions/free-disk-space/**'
      - '.github/workflows/build-all-images.yaml'
      - 'components/docker-bake.hcl'
      - 'components/common/**'
      - 'components/sensing-perception/**'
      - 'components/localization-mapping/**'
      - 'components/planning-control/**'
      - 'components/vehicle-system/**'
      - 'components/api/**'
      - 'components/visualizer/**'
      - 'components/simulator/**'
      - 'components/universe/**'
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

concurrency:
  group: build-all-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX_COMMON: ghcr.io/${{ github.repository_owner }}/openadkit-common
  IMAGE_PREFIX_COMPONENT: ghcr.io/${{ github.repository_owner }}/openadkit
  BAKE_FILE: components/docker-bake.hcl

jobs:
  prepare:
    runs-on: ${{ github.repository_owner == 'oguzkaganozt' && 'ubicloud-standard-30-ubuntu-2204' || 'ubuntu-22.04' }}
    permissions:
      contents: read
    outputs:
      autoware_ref: ${{ steps.prepare.outputs.autoware_ref }}
      build_tag: ${{ steps.prepare.outputs.build_tag }}
      cache_scope: ${{ steps.prepare.outputs.cache_scope }}
    steps:
      - name: Resolve shared build inputs
        id: prepare
        run: |
          set -euo pipefail
          autoware_ref=$(git ls-remote https://github.com/autowarefoundation/autoware refs/heads/main | cut -f1)
          build_tag="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          safe_ref=$(printf '%s' "${GITHUB_REF_NAME:-unknown}" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-60)
          ref_hash=$(printf '%s' "${GITHUB_REF:-unknown}" | sha256sum | cut -c1-12)
          if [ "${GITHUB_REF:-}" = "refs/heads/main" ]; then
            cache_scope="main"
          else
            cache_scope="${safe_ref}-${ref_hash}"
          fi
          {
            echo "autoware_ref=${autoware_ref}"
            echo "build_tag=${build_tag}"
            echo "cache_scope=${cache_scope}"
          } >> "$GITHUB_OUTPUT"
        shell: bash

  # =============================================================================
  # Stage 1: Build common images
  # =============================================================================
  build-common:
    needs: prepare
    runs-on: ${{ github.repository_owner == 'oguzkaganozt' && (matrix.platform == 'linux/amd64' && 'ubicloud-standard-30-ubuntu-2204' || 'ubicloud-standard-30-arm-ubuntu-2204') || (matrix.platform == 'linux/amd64' && 'ubuntu-22.04' || 'ubuntu-22.04-arm') }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        platform: [linux/amd64, linux/arm64]
        ros-distro: [humble, jazzy]
    steps:
      - name: Checkout OpenADKit repository
        uses: actions/checkout@v6

      - name: Free Disk Space (Ubuntu)
        uses: ./.github/actions/free-disk-space

      - name: Install jq and vcs2l
        run: |
          sudo apt-get update
          sudo apt-get install -y jq pipx
          pipx install vcs2l
        shell: bash

      - name: Checkout Autoware repository
        uses: actions/checkout@v6
        with:
          repository: autowarefoundation/autoware
          ref: ${{ needs.prepare.outputs.autoware_ref }}
          path: autoware
          fetch-depth: 1

      - name: Pull Autoware Source
        run: |
            mkdir -p autoware/src
            vcs import --shallow autoware/src < autoware/repositories/autoware.repos
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for openadkit-common:base
        id: meta-common-base
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX_COMMON }}
          bake-target: docker-metadata-action-common-base
          tags: |
            type=raw,value=base-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
          flavor: |
            latest=false

      - name: Extract metadata for openadkit-common:base-cuda
        id: meta-common-base-cuda
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX_COMMON }}
          bake-target: docker-metadata-action-common-base-cuda
          tags: |
            type=raw,value=base-cuda-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
          flavor: |
            latest=false

      - name: Extract metadata for openadkit-common:devel
        id: meta-common-devel
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX_COMMON }}
          bake-target: docker-metadata-action-common-devel
          tags: |
            type=raw,value=devel-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
          flavor: |
            latest=false

      - name: Extract metadata for openadkit-common:devel-cuda
        id: meta-common-devel-cuda
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX_COMMON }}
          bake-target: docker-metadata-action-common-devel-cuda
          tags: |
            type=raw,value=devel-cuda-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
          flavor: |
            latest=false

      - name: Build and push common images (non-CUDA)
        uses: docker/bake-action@v5
        with:
          files: |
            ${{ env.BAKE_FILE }}
            ${{ steps.meta-common-base.outputs.bake-file }}
            ${{ steps.meta-common-devel.outputs.bake-file }}
          targets: |
            common-base
            common-devel
          push: true
          set: |
            *.platform=${{ matrix.platform }}
            *.args.ROS_DISTRO=${{ matrix.ros-distro }}
            *.args.BASE_IMAGE=ros:${{ matrix.ros-distro }}-ros-base-${{ matrix.ros-distro == 'jazzy' && 'noble' || 'jammy' }}
            *.labels.org.opencontainers.image.build-tag=${{ needs.prepare.outputs.build_tag }}
            *.labels.org.opencontainers.image.run-id=${{ github.run_id }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            *.cache-from=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:common-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.cache_scope }}
            *.cache-to=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:common-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.cache_scope }},mode=max

      - name: Build and push common images (CUDA, amd64 only)
        if: matrix.platform == 'linux/amd64'
        uses: docker/bake-action@v5
        with:
          files: |
            ${{ env.BAKE_FILE }}
            ${{ steps.meta-common-base-cuda.outputs.bake-file }}
            ${{ steps.meta-common-devel-cuda.outputs.bake-file }}
          targets: |
            common-base-cuda
            common-devel-cuda
          push: true
          set: |
            *.platform=${{ matrix.platform }}
            *.args.ROS_DISTRO=${{ matrix.ros-distro }}
            *.args.BASE_IMAGE=ros:${{ matrix.ros-distro }}-ros-base-${{ matrix.ros-distro == 'jazzy' && 'noble' || 'jammy' }}
            *.labels.org.opencontainers.image.build-tag=${{ needs.prepare.outputs.build_tag }}
            *.labels.org.opencontainers.image.run-id=${{ github.run_id }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            *.cache-from=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:common-cuda-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.cache_scope }}
            *.cache-to=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:common-cuda-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.cache_scope }},mode=max

  # =============================================================================
  # Stage 2: Build component images (parallel)
  # =============================================================================
  build-components:
    runs-on: ${{ github.repository_owner == 'oguzkaganozt' && (matrix.platform == 'linux/amd64' && 'ubicloud-standard-30-ubuntu-2204' || 'ubicloud-standard-30-arm-ubuntu-2204') || (matrix.platform == 'linux/amd64' && 'ubuntu-22.04' || 'ubuntu-22.04-arm') }}
    needs: [prepare, build-common]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        platform: [linux/amd64, linux/arm64]
        ros-distro: [humble, jazzy]
        target:
          - sensing-perception
          - localization-mapping
          - planning-control
          - vehicle-system
          - api
          - visualizer
          - simulator
        include:
          # CUDA variant only on amd64
          - platform: linux/amd64
            ros-distro: humble
            target: sensing-perception-cuda
          - platform: linux/amd64
            ros-distro: jazzy
            target: sensing-perception-cuda
    steps:
      - name: Checkout OpenADKit repository
        uses: actions/checkout@v6

      - name: Free Disk Space (Ubuntu)
        uses: ./.github/actions/free-disk-space

      - name: Install jq and vcs2l
        run: |
          sudo apt-get update
          sudo apt-get install -y jq pipx
          pipx install vcs2l
        shell: bash

      - name: Checkout Autoware repository
        uses: actions/checkout@v6
        with:
          repository: autowarefoundation/autoware
          ref: ${{ needs.prepare.outputs.autoware_ref }}
          path: autoware
          fetch-depth: 1

      - name: Pull Autoware Source
        run: |
            mkdir -p autoware/src
            vcs import --shallow autoware/src < autoware/repositories/autoware.repos
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.target }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX_COMPONENT }}
          bake-target: docker-metadata-action-${{ matrix.target }}
          tags: |
            type=raw,value=${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
          flavor: |
            latest=false

      - name: Build and push ${{ matrix.target }}
        uses: docker/bake-action@v5
        with:
          files: |
            ${{ env.BAKE_FILE }}
            ${{ steps.meta.outputs.bake-file }}
          targets: ${{ matrix.target }}
          push: true
          set: |
            *.platform=${{ matrix.platform }}
            *.args.ROS_DISTRO=${{ matrix.ros-distro }}
            *.args.COMMON_BASE_IMAGE=${{ env.IMAGE_PREFIX_COMMON }}:base-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.COMMON_BASE_CUDA_IMAGE=${{ env.IMAGE_PREFIX_COMMON }}:base-cuda-amd64-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.COMMON_DEVEL_IMAGE=${{ env.IMAGE_PREFIX_COMMON }}:devel-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.COMMON_DEVEL_CUDA_IMAGE=${{ env.IMAGE_PREFIX_COMMON }}:devel-cuda-amd64-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.labels.org.opencontainers.image.build-tag=${{ needs.prepare.outputs.build_tag }}
            *.labels.org.opencontainers.image.run-id=${{ github.run_id }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            *.cache-from=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.cache_scope }}
            *.cache-to=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.cache_scope }},mode=max

  # =============================================================================
  # Stage 3: Build universe and universe-cuda images (parallel)
  # =============================================================================
  build-universe:
    runs-on: ${{ github.repository_owner == 'oguzkaganozt' && (matrix.platform == 'linux/amd64' && 'ubicloud-standard-30-ubuntu-2204' || 'ubicloud-standard-30-arm-ubuntu-2204') || (matrix.platform == 'linux/amd64' && 'ubuntu-22.04' || 'ubuntu-22.04-arm') }}
    needs: [prepare, build-common, build-components]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        platform: [linux/amd64, linux/arm64]
        ros-distro: [humble, jazzy]
        target: [universe]
        include:
          # CUDA variant only on amd64
          - platform: linux/amd64
            ros-distro: humble
            target: universe-cuda
          - platform: linux/amd64
            ros-distro: jazzy
            target: universe-cuda
    steps:
      - name: Checkout OpenADKit repository
        uses: actions/checkout@v6

      - name: Free Disk Space (Ubuntu)
        uses: ./.github/actions/free-disk-space

      - name: Install jq and vcs2l
        run: |
          sudo apt-get update
          sudo apt-get install -y jq pipx
          pipx install vcs2l
        shell: bash

      - name: Checkout Autoware repository
        uses: actions/checkout@v6
        with:
          repository: autowarefoundation/autoware
          ref: ${{ needs.prepare.outputs.autoware_ref }}
          path: autoware
          fetch-depth: 1

      - name: Pull Autoware Source
        run: |
            mkdir -p autoware/src
            vcs import --shallow autoware/src < autoware/repositories/autoware.repos
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.target }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX_COMPONENT }}
          bake-target: docker-metadata-action-${{ matrix.target }}
          tags: |
            type=raw,value=${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
          flavor: |
            latest=false

      - name: Build and push ${{ matrix.target }}
        uses: docker/bake-action@v5
        with:
          files: |
            ${{ env.BAKE_FILE }}
            ${{ steps.meta.outputs.bake-file }}
          targets: ${{ matrix.target }}
          push: true
          set: |
            *.platform=${{ matrix.platform }}
            *.args.ROS_DISTRO=${{ matrix.ros-distro }}
            *.args.COMMON_BASE_IMAGE=${{ env.IMAGE_PREFIX_COMMON }}:base-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.COMMON_BASE_CUDA_IMAGE=${{ env.IMAGE_PREFIX_COMMON }}:base-cuda-amd64-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.COMMON_DEVEL_IMAGE=${{ env.IMAGE_PREFIX_COMMON }}:devel-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.COMMON_DEVEL_CUDA_IMAGE=${{ env.IMAGE_PREFIX_COMMON }}:devel-cuda-amd64-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.SENSING_PERCEPTION_IMAGE=${{ env.IMAGE_PREFIX_COMPONENT }}:sensing-perception-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.SENSING_PERCEPTION_CUDA_IMAGE=${{ env.IMAGE_PREFIX_COMPONENT }}:sensing-perception-cuda-amd64-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.LOCALIZATION_MAPPING_IMAGE=${{ env.IMAGE_PREFIX_COMPONENT }}:localization-mapping-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.PLANNING_CONTROL_IMAGE=${{ env.IMAGE_PREFIX_COMPONENT }}:planning-control-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.VEHICLE_SYSTEM_IMAGE=${{ env.IMAGE_PREFIX_COMPONENT }}:vehicle-system-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.API_IMAGE=${{ env.IMAGE_PREFIX_COMPONENT }}:api-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.VISUALIZER_IMAGE=${{ env.IMAGE_PREFIX_COMPONENT }}:visualizer-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.SIMULATOR_IMAGE=${{ env.IMAGE_PREFIX_COMPONENT }}:simulator-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.labels.org.opencontainers.image.build-tag=${{ needs.prepare.outputs.build_tag }}
            *.labels.org.opencontainers.image.run-id=${{ github.run_id }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            *.cache-from=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.cache_scope }}
            *.cache-to=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.cache_scope }},mode=max

  # =============================================================================
  # Stage 4: Create multi-arch manifests
  # =============================================================================
  create-manifests:
    runs-on: ${{ github.repository_owner == 'oguzkaganozt' && 'ubicloud-standard-30-ubuntu-2204' || 'ubuntu-22.04' }}
    needs: [prepare, build-common, build-components, build-universe]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        ros-distro: [humble, jazzy]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Combine multi-arch images
        uses: ./.github/actions/combine-multi-arch-images
        with:
          ros-distro: ${{ matrix.ros-distro }}
          build-tag: ${{ needs.prepare.outputs.build_tag }}
          registry: ${{ env.REGISTRY }}
          image-prefix-common: ${{ env.IMAGE_PREFIX_COMMON }}
          image-prefix-component: ${{ env.IMAGE_PREFIX_COMPONENT }}
          component-targets: >-
            sensing-perception
            sensing-perception-cuda
            localization-mapping
            planning-control
            vehicle-system
            api
            visualizer
            simulator
            universe
            universe-cuda
          publish-stable-tags: ${{ github.ref == 'refs/heads/main' }}
          token: ${{ secrets.GITHUB_TOKEN }}

  summarize:
    runs-on: ${{ github.repository_owner == 'oguzkaganozt' && 'ubicloud-standard-30-ubuntu-2204' || 'ubuntu-latest' }}
    needs: [prepare, create-manifests]
    if: success()
    steps:
      - name: Write job summary
        run: |
          {
            echo "## Build Complete"
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| **build_tag** | \`${{ needs.prepare.outputs.build_tag }}\` |"
            echo "| **autoware_ref** | \`${{ needs.prepare.outputs.autoware_ref }}\` |"
            echo ""
            echo "To release this build:"
            echo "1. Go to **Actions → release → Run workflow**"
            echo "2. Set \`build_tag\` to \`${{ needs.prepare.outputs.build_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    runs-on: ${{ github.repository_owner == 'oguzkaganozt' && 'ubicloud-standard-30-ubuntu-2204' || 'ubuntu-latest' }}
    needs: [prepare, build-common, build-components, build-universe, create-manifests]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Scheduled build failed (${new Date().toISOString().split('T')[0]})`,
              body: [
                '**Scheduled build-all-images workflow failed.**',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            })
