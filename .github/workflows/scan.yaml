name: scan-images

on:
  workflow_run:
    workflows: [build-all-images]
    types: [completed]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX_COMMON: ghcr.io/${{ github.repository_owner }}/openadkit-common
  IMAGE_PREFIX_COMPONENT: ghcr.io/${{ github.repository_owner }}/openadkit

jobs:
  scan:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        ros-distro: [humble, jazzy]
        platform: [amd64, arm64]
        target:
          - base
          - base-cuda
          - devel
          - devel-cuda
          - sensing-perception
          - sensing-perception-cuda
          - localization-mapping
          - planning-control
          - vehicle-system
          - api
          - visualizer
          - simulator
          - universe
          - universe-cuda
        exclude:
          - platform: arm64
            target: base-cuda
          - platform: arm64
            target: devel-cuda
          - platform: arm64
            target: sensing-perception-cuda
          - platform: arm64
            target: universe-cuda
    steps:
      - name: Resolve image reference
        id: image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            run_id="${{ github.event.workflow_run.id }}"
            run_attempt="${{ github.event.workflow_run.run_attempt }}"
          else
            runs_json=$(gh api "repos/${{ github.repository }}/actions/workflows/build-all-images.yaml/runs?branch=main&status=completed&per_page=100")
            run_info=$(printf '%s' "$runs_json" | jq -r '.workflow_runs | map(select(.conclusion == "success")) | first | if . == null then empty else "\(.id) \(.run_attempt)" end')
            if [ -z "$run_info" ]; then
              echo "Could not find a successful build-all-images run on main" >&2
              exit 1
            fi

            read -r run_id run_attempt <<< "$run_info"
          fi

          build_tag="${run_id}-${run_attempt}"
          case "${{ matrix.target }}" in
            base|base-cuda|devel|devel-cuda)
              image_prefix="${{ env.IMAGE_PREFIX_COMMON }}"
              ;;
            *)
              image_prefix="${{ env.IMAGE_PREFIX_COMPONENT }}"
              ;;
          esac
          echo "image_ref=${image_prefix}:${{ matrix.target }}-${{ matrix.platform }}-${{ matrix.ros-distro }}-${build_tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan ${{ matrix.target }}-${{ matrix.platform }}-${{ matrix.ros-distro }}
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ steps.image.outputs.image_ref }}
          format: sarif
          output: trivy-${{ matrix.target }}-${{ matrix.platform }}-${{ matrix.ros-distro }}.sarif
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Upload scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.target }}-${{ matrix.platform }}-${{ matrix.ros-distro }}.sarif
          category: ${{ matrix.target }}-${{ matrix.platform }}-${{ matrix.ros-distro }}
