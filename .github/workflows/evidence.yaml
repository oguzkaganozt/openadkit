name: evidence

# Run the verification cells against one build and emit a signed in-toto Test
# Result attestation. The subjects are the built image digests plus the
# deployment and shared asset checksums of the staged release kit.
#
# The release gate requires a complete PASSED attestation. CI quarantine remains
# visible as WARNED and never bypasses the release gate.

permissions:
  contents: read

on:
  # Builds of main only: a release line scans and verifies its builds by
  # dispatch on its own branch, where the release gate expects them.
  workflow_run:
    workflows: [build-all-images]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_tag:
        description: 'Build tag to verify (e.g. 123456789-1)'
        required: true
  workflow_call:
    inputs:
      build_tag:
        description: 'Build tag to verify (e.g. 123456789-1)'
        required: true
        type: string

concurrency:
  group: evidence-${{ github.event_name == 'workflow_run' && format('{0}-{1}', github.event.workflow_run.id, github.event.workflow_run.run_attempt) || inputs.build_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      build_tag: ${{ steps.prepare.outputs.build_tag }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      cells: ${{ steps.cells.outputs.cells }}
    steps:
      - name: Resolve build metadata
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_BUILD_TAG: ${{ inputs.build_tag }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            run_id="${{ github.event.workflow_run.id }}"
            # "Re-run failed jobs" keeps the first attempt's tag; read it from
            # the newest metadata artifact instead of this attempt's number.
            build_tag=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired | not) | .name | select(startswith("build-metadata-")) | ltrimstr("build-metadata-")' \
              | sort -V | tail -n 1)
            [ -n "${build_tag}" ] || { echo "Build run ${run_id} has no build metadata artifact" >&2; exit 1; }
          else
            build_tag="${DISPATCH_BUILD_TAG}"
            if ! printf '%s\n' "${build_tag}" | grep -Eq '^[0-9]+-[0-9]+$'; then
              echo "Invalid build_tag '${build_tag}': must be RUN_ID-RUN_ATTEMPT" >&2
              exit 1
            fi
            run_id="${build_tag%%-*}"
          fi

          metadata_dir="${RUNNER_TEMP}/openadkit-build-metadata"
          mkdir -p "${metadata_dir}"
          gh run download "${run_id}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "build-metadata-${build_tag}" \
            --dir "${metadata_dir}"

          source_sha=$(jq -r '.openadkit_sha' "${metadata_dir}/build-metadata.json")
          if ! printf '%s\n' "${source_sha}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Invalid OpenADKit SHA in build metadata: ${source_sha}" >&2
            exit 1
          fi

          {
            echo "build_tag=${build_tag}"
            echo "source_sha=${source_sha}"
          } >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.prepare.outputs.source_sha }}

      - name: List evidence cells
        # Every deployment and distro the manifests declare, minus the
        # deployments with an evidence exemption. Each row is a complete cell
        # plan: identity, nodes and the checks run_cell.sh executes.
        id: cells
        run: |
          set -euo pipefail
          cells=$(python3 .github/scripts/validation_matrix.py --source-root . --evidence-cells --include-example-kits)
          echo "cells=${cells}" >> "$GITHUB_OUTPUT"

      - name: Stage evidence kit
        run: |
          set -euo pipefail
          bash .github/scripts/evidence/stage_kit.sh \
            "$PWD" "$RUNNER_TEMP/openadkit-build-metadata/build-metadata.json" "$PWD/evidence-kit" \
            "${{ steps.prepare.outputs.source_sha }}"

      - name: Upload evidence kit
        uses: actions/upload-artifact@v7
        with:
          name: evidence-kit-${{ steps.prepare.outputs.build_tag }}
          path: evidence-kit
          retention-days: 7

      - name: Upload build metadata
        uses: actions/upload-artifact@v7
        with:
          name: evidence-build-metadata-${{ steps.prepare.outputs.build_tag }}
          path: ${{ runner.temp }}/openadkit-build-metadata/build-metadata.json
          retention-days: 7

  cell:
    needs: prepare
    runs-on: ${{ vars.RUNNER_AMD64 || 'ubuntu-22.04' }}
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.cells) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Download evidence kit
        uses: actions/download-artifact@v8
        with:
          name: evidence-kit-${{ needs.prepare.outputs.build_tag }}
          path: evidence-kit

      - name: Restore launcher permissions
        # Artifact downloads do not preserve executable bits.
        run: chmod +x evidence-kit/openadkit

      - name: Install Docker Compose v5.2+
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/install-compose.sh

      - name: Download build metadata for the overlay build
        if: ${{ matrix.kit != '' }}
        uses: actions/download-artifact@v8
        with:
          name: evidence-build-metadata-${{ needs.prepare.outputs.build_tag }}
          path: build-metadata

      - name: Build the example workspace in the pinned devel image
        if: ${{ matrix.kit != '' }}
        env:
          KIT_PATH: ${{ matrix.kit }}
          DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          DEVEL_IMAGE=$(jq -er --arg distro "$DISTRO" '
            .images[] | select(.target == "universe-common-devel" and .ros_distro == $distro)
            | .repo + "@" + .digest
          ' build-metadata/build-metadata.json)
          export DEVEL_IMAGE
          bash "evidence-kit/$KIT_PATH/overlay_ws/build.sh" "$DISTRO"

      - name: Run evidence cell
        id: cell
        working-directory: evidence-kit
        env:
          BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          CELL: ${{ toJson(matrix) }}
          KIT_PATH: ${{ matrix.kit }}
          OPENADKIT_CLI: ${{ github.workspace }}/evidence-kit/openadkit
        run: |
          set -uo pipefail
          if [ -n "$KIT_PATH" ]; then cd "$KIT_PATH"; fi
          runner="$GITHUB_WORKSPACE/.github/scripts/evidence/run_cell.sh"
          output="$GITHUB_WORKSPACE/cell-output"
          cell_name=$(jq -r '.name' <<<"$CELL")

          mkdir -p "$output"
          status=0
          if ! bash "$runner" "$CELL" "$output/attempt-1"; then
            echo "::warning title=evidence retry::${cell_name} failed on the first attempt; retrying once"
            rm -rf "$output/attempt-2"
            if ! bash "$runner" "$CELL" "$output/attempt-2"; then
              echo "cell ${cell_name} failed after the retry" >&2
              status=1
            fi
          fi

          # Collect the final attempt even when it failed: the attestation must
          # carry a FAILED cell instead of silently missing one.
          final="$output/attempt-2"
          [ -d "$final" ] || final="$output/attempt-1"
          mkdir -p "$GITHUB_WORKSPACE/cells"
          cp -a "$final" "$GITHUB_WORKSPACE/cells/${cell_name}"
          exit "$status"
        shell: bash

      - name: Upload cell artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-cell-${{ matrix.name }}
          path: |
            cells
            cell-output
          retention-days: 14

  attest:
    needs: [prepare, cell]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Download cell artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: evidence-cell-*
          merge-multiple: true
          path: evidence-cells

      - name: Download build metadata
        uses: actions/download-artifact@v8
        with:
          name: evidence-build-metadata-${{ needs.prepare.outputs.build_tag }}
          path: build-metadata

      - name: Build attestation inputs
        env:
          EVIDENCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 .github/scripts/evidence/test_result.py \
            --cells-dir evidence-cells/cells \
            --build-metadata build-metadata/build-metadata.json \
            --source-root . \
            --quarantine .github/evidence-quarantine.json \
            --expected-cells '${{ needs.prepare.outputs.cells }}' \
            --output-dir attestation

      - name: Attest the test result
        id: attest
        uses: actions/attest@v4
        with:
          subject-checksums: attestation/evidence-subjects.txt
          predicate-path: attestation/evidence-predicate.json
          predicate-type: https://in-toto.io/attestation/test-result/v0.1

      - name: Upload attestation inputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-attestation-${{ needs.prepare.outputs.build_tag }}
          path: |
            attestation
            ${{ steps.attest.outputs.bundle-path }}
          retention-days: 90

      - name: Write job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Evidence for build \`${{ needs.prepare.outputs.build_tag }}\`"
            echo
            python3 .github/scripts/evidence/report.py \
              --current attestation/evidence-summary.json
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Fail when the evidence did not pass
        if: always()
        run: |
          set -euo pipefail
          result=$(jq -r '.result' attestation/evidence-summary.json)
          if [ "${result}" = "WARNED" ]; then
            echo "::warning title=evidence warned::quarantined cells did not pass; see .github/evidence-quarantine.json"
          elif [ "${result}" != "PASSED" ]; then
            echo "evidence result is ${result}" >&2
            exit 1
          fi
        shell: bash

  # Report evidence for the weekly Autoware snapshot bump (bump-autoware.yaml)
  # as a commit status on its pull request, where a dispatched run shows no check.
  bump-status:
    needs: [prepare, attest]
    if: ${{ always() && github.ref == 'refs/heads/ci/bump-autoware' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Report the evidence result
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha || github.sha }}
          ATTESTED: ${{ needs.attest.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          state=failure
          [ "${ATTESTED}" != success ] || state=success
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA}" -f state="${state}" \
            -f context="bump-autoware / evidence" -f description="evidence cells: ${ATTESTED}" \
            -f target_url="${RUN_URL}" >/dev/null
        shell: bash
