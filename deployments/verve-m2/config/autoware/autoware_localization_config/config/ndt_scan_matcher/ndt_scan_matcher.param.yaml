# Verve M2: NDT reports its own uncertainty instead of a fixed value.
#
# The stock file fixes output_pose_covariance at 0.0225 m^2 (sigma 15 cm) for
# every scan, whatever the match was worth. On this stack that is wrong in a
# way the EKF notices: the M2's park brake holds the vehicle at exactly zero
# speed, so the EKF has no motion noise to inflate its own covariance and ends
# up believing its lateral position to 0.8 mm. The 5 cm it then differs from
# NDT by blows past the Mahalanobis gate (pose_gate_dist 49.5, measured 91),
# the pose is dropped, sensor_fusion_status goes WARN, and /autoware/modes/
# autonomous with it -- the AUTO button stays disabled.
#
# LAPLACE_APPROXIMATION has NDT perturb its initial guess and fit the actual
# score landscape, so the covariance follows the scan instead of a constant.
# That is upstream's own option (covariance_estimation_type: 1); only the
# choice is local to this kit.
/**:
  ros__parameters:
    covariance:
      covariance_estimation:
        covariance_estimation_type: 1 # LAPLACE_APPROXIMATION (stock: 0, FIXED_VALUE)
