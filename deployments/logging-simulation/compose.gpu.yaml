# GPU overlay for logging simulation — swap sensing/perception onto the CUDA
# images and reserve the GPU. Model flags come from settings.gpu.env.
services:
  sensing:
    image: ${SENSING_PERCEPTION_GPU_IMAGE:?set by the openadkit CLI}
    # CenterPoint runs in sensing's pointcloud container; the CLI installs its
    # models here.
    volumes:
      - ${CENTERPOINT_DATA_PATH}:/autoware_data/lidar_centerpoint:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  # The bag plays from the image sensing runs, so GPU mode pulls no CPU image for it.
  rosbag:
    image: ${SENSING_PERCEPTION_GPU_IMAGE:?set by the openadkit CLI}
  perception:
    image: ${SENSING_PERCEPTION_GPU_IMAGE:?set by the openadkit CLI}
    # The CLI installs the CenterPoint models here; mount the same path.
    volumes:
      - ${CENTERPOINT_DATA_PATH}:/autoware_data/lidar_centerpoint:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
