# Visualizer — RViz behind noVNC, over plain HTTP.
# `ports:` is ignored under `network_mode: host`. Websockify binds to loopback by
# default (`WEBSOCKIFY_BIND=127.0.0.1`); reach it remotely through an SSH tunnel.
# To expose noVNC itself, set WEBSOCKIFY_BIND=0.0.0.0 and front the port with an
# authenticated reverse proxy, or serve HTTPS with your own certificate:
# NOVNC_CERT and NOVNC_KEY name its files, which a kit mounts into this service.
services:
  visualizer:
    extends:
      file: autoware.yaml
      service: autoware
    image: ${VISUALIZER_IMAGE:?set by the openadkit CLI}
    container_name: autoware-visualizer
    # No pid: service:map. RViz runs without ros2 launch, so it has no
    # launch_ros_<PID> node to keep unique, and a split simulator role has no
    # map service to join.
    environment:
      - RVIZ_CONFIG=${RVIZ_CONFIG}
      - USE_SIM_TIME=${USE_SIM_TIME}
      - REMOTE_DISPLAY=${REMOTE_DISPLAY}
      - REMOTE_PASSWORD=${REMOTE_PASSWORD}
      - WEBSOCKIFY_BIND=${WEBSOCKIFY_BIND:-127.0.0.1}
      - RVIZ_GPU=${RVIZ_GPU:-auto}
      - NOVNC_CERT=${NOVNC_CERT:-}
      - NOVNC_KEY=${NOVNC_KEY:-}
      # REMOTE_DISPLAY=false opens RViz on the desktop's X server, reached
      # over the host network; its cookie comes from the session's XAUTHORITY.
      - DISPLAY=${DISPLAY:-}
      - XAUTHORITY=/tmp/.Xauthority
    volumes:
      - ${XAUTHORITY:-/dev/null}:/tmp/.Xauthority:ro
