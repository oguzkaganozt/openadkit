# Planning — computes a safe, feasible trajectory to the goal.
services:
  planning:
    image: ${PLANNING_IMAGE:?set by the openadkit CLI}
    container_name: autoware-planning
    network_mode: host
    init: true
    ipc: host
    pid: service:map
    env_file:
      - ../runtime.env
    volumes:
      - ../cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
      # Integrator layer, applied by the image's entrypoint hook (components/shared/entrypoint).
      - ${OPENADKIT_CONFIG_SHARED:?set by the openadkit CLI}:/openadkit/config/shared:ro
      - ${OPENADKIT_CONFIG_BASE:?set by the openadkit CLI}:/openadkit/config/base:ro
      - ${OPENADKIT_CONFIG_DEPLOYMENT:?set by the openadkit CLI}:/openadkit/config/deployment:ro
      - ${OPENADKIT_OVERLAY_WS:?set by the openadkit CLI}:/openadkit/overlay_ws:ro
    command: >
      ros2 launch autoware_launch component_planning.launch.xml
      data_path:=/autoware_data/ml_models
      enable_all_modules_auto_mode:=${ENABLE_ALL_MODULES_AUTO_MODE}
      is_simulation:=${IS_SIMULATION_MODE}
      module_preset:=${PLANNING_MODULE_PRESET}
      planning_setting:=${PLANNING_SETTING:-rule_based}
      use_sim_time:=${USE_SIM_TIME}
      vehicle_model:=${VEHICLE_MODEL}
    restart: on-failure
