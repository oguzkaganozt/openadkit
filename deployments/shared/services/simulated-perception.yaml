# Simulated perception — what the planning stack sees without sensors: dummy
# objects (or the scenario runner's), tracked and predicted as on the vehicle,
# plus the occupancy grid map. Upstream launches it next to the simulator.
services:
  simulated-perception:
    extends:
      file: base.yaml
      service: autoware
    image: ${SIMULATOR_IMAGE:?set by the openadkit CLI}
    container_name: autoware-simulated-perception
    pid: service:map
    volumes:
      - ../launch/component.launch.py:/openadkit/launch/component.launch.py:ro
    command: >
      ros2 launch /openadkit/launch/component.launch.py component:=planning_simulator/perception_simulation
      launch_dummy_perception:=${LAUNCH_DUMMY_PERCEPTION}
      launch_occupancy_grid_map:=${LAUNCH_OCCUPANCY_GRID_MAP}
      perception/enable_detection_failure:=${PERCEPTION_ENABLE_DETECTION_FAILURE}
      perception/enable_object_recognition:=${PERCEPTION_ENABLE_OBJECT_RECOGNITION}
      perception/use_base_link_z:=${PERCEPTION_USE_BASE_LINK_Z}
      pointcloud_container_name:=${POINTCLOUD_CONTAINER_NAME}
      sensing/visible_range:=${SENSING_VISIBLE_RANGE}
      use_pointcloud_container:=${USE_POINTCLOUD_CONTAINER}
      use_sim_time:=${USE_SIM_TIME}
