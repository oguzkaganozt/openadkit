# System — diagnostics, MRM handling, and system monitoring.
# SYSTEM_DIAGNOSTICS_GRAPH selects the diagnostics graph definition
# (autoware-main.yaml by default, autoware-carla.yaml for carla-simulation).
services:
  system:
    extends:
      file: autoware.yaml
      service: autoware
    image: ${VEHICLE_SYSTEM_IMAGE:?set by the openadkit CLI}
    container_name: autoware-system
    pid: service:map
    command: >
      ros2 launch autoware_launch tier4_system_component.launch.xml
      diagnostic_graph_aggregator_graph_path:=/tmp/openadkit/autoware_launch/share/autoware_launch/config/system/diagnostics/${SYSTEM_DIAGNOSTICS_GRAPH:-autoware-main.yaml}
      launch_fault_injection:=${LAUNCH_FAULT_INJECTION:-false}
      launch_system_monitor:=${LAUNCH_SYSTEM_MONITOR}
      launch_dummy_diag_publisher:=${LAUNCH_DUMMY_DIAG_PUBLISHER}
      sensor_model:=${SENSOR_MODEL}
      system_run_mode:=${SYSTEM_RUN_MODE}
      use_sim_time:=${USE_SIM_TIME}
