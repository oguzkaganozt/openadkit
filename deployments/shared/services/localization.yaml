# Localization — determines the vehicle's position on the map.
# Its pointcloud preprocessing runs in a container of its own, not in
# sensing-perception's: a restart of either service then leaves no node of it
# in the other's process.
services:
  localization:
    extends:
      file: autoware.yaml
      service: autoware
    image: ${LOCALIZATION_MAPPING_IMAGE:?set by the openadkit CLI}
    container_name: autoware-localization
    pid: service:map
    command: >
      ros2 launch autoware_launch component_localization.launch.xml
      launch_pointcloud_container:=true
      localization_pointcloud_container_name:=localization_pointcloud_container
      system_run_mode:=${SYSTEM_RUN_MODE}
      use_sim_time:=${USE_SIM_TIME}
      vehicle_model:=${VEHICLE_MODEL}
