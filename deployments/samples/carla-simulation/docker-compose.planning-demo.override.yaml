services:
  carla-ros-bridge:
    command: >
      /bin/bash -lc "set -e;
      ros2 launch carla_ros_bridge carla_ros_bridge.launch.py
      host:=${CARLA_ROS_BRIDGE_HOST}
      port:=${CARLA_ROS_BRIDGE_PORT}
      town:=${CARLA_WORLD}
      $(if [ x${CARLA_SYNCHRONOUS_MODE} != x ]; then echo synchronous_mode:=${CARLA_SYNCHRONOUS_MODE}; fi)
      ${CARLA_ROS_BRIDGE_LAUNCH_ARGS} &
      bridge_pid=$$!;
      sleep 5;
      ros2 launch carla_spawn_objects carla_spawn_objects.launch.py
      spawn_point_ego_vehicle:=None;
      wait $$bridge_pid"

  planning-demo-mrm-suppressor:
    image: ghcr.io/autowarefoundation/openadkit:vehicle-system
    network_mode: host
    init: true
    pid: service:map
    ipc: host
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
    depends_on:
      - map
      - system
    command:
      - bash
      - -lc
      - >
        source /opt/autoware/setup.bash;
        for _ in $(seq 1 60); do
          if ! pgrep -f /opt/autoware/lib/[a]utoware_mrm_handler/autoware_mrm_handler_node >/dev/null; then break; fi;
          if pkill -f /opt/autoware/lib/[a]utoware_mrm_handler/autoware_mrm_handler_node; then break; fi;
          sleep 1;
        done;
        ros2 topic pub /system/fail_safe/mrm_state autoware_adapi_v1_msgs/msg/MrmState
        "{state: 1, behavior: 1}" -r 5 &
        ros2 topic pub /system/mrm/emergency_stop/status tier4_system_msgs/msg/MrmBehaviorStatus
        "{state: 1}" -r 5 &
        wait
    restart: on-failure
