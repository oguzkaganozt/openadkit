# The carla role's services for CARLA simulation: CARLA, its interface and map
# loader, and the visualizer, which split-host runs on this host rather than
# the edge.
#
# Shared by the single-host compose.yaml and the
# `--role carla` view (this file plus compose.zenoh.yaml). All cross-service
# edges here are sim-local
# (carla-interface waits on CARLA and the map loader), so they stay in this
# file; the visualizer's edges to Autoware are in compose.yaml. CARLA
# RPC and map loading are host-local and never cross Zenoh. No
# pid: service:map: the CARLA host has no map service.
include:
  - ../shared/services/visualizer.yaml

services:
  # The visualizer renders CARLA on the GPU, so it needs the graphics caps.
  visualizer:
    container_name: autoware-e2e-visualizer
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=graphics,compute,utility,display

  carla:
    image: ${CARLA_CONTAINER_IMAGE:?pinned in openadkit.json externalImages}
    container_name: ${CARLA_CONTAINER_NAME}
    network_mode: host
    init: true
    ipc: host
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    command: >
      /bin/bash ./CarlaUE4.sh
      ${CARLA_RENDER_ARGS}
      -nosound
      -quality-level=${CARLA_QUALITY}
      -carla-rpc-port=${CARLA_RPC_PORT}
      -world-port=${CARLA_WORLD_PORT}
      -stdout
      -FullStdOutLogOutput
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/${CARLA_RPC_PORT}'"]
      interval: 5s
      timeout: 2s
      retries: 60
      start_period: 30s
    restart: on-failure

  carla-interface:
    image: ${SIMULATOR_IMAGE:?set by the openadkit CLI}
    container_name: ${CARLA_INTERFACE_CONTAINER}
    network_mode: host
    init: true
    ipc: host
    env_file:
      - ../shared/runtime.env
    volumes:
      - ../shared/cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
      - ./config/sensor_mapping.yaml:/autoware_config/sensor_mapping.yaml:ro
    depends_on:
      carla:
        condition: service_healthy
        restart: true
      carla-map-loader:
        condition: service_completed_successfully
        restart: true
    command: >
      ros2 launch autoware_carla_interface autoware_carla_interface.launch.xml
      host:=${CARLA_RPC_HOST}
      port:=${CARLA_RPC_PORT}
      timeout:=${CARLA_LOAD_TIMEOUT}
      carla_map:=${CARLA_WORLD}
      sensor_kit_name:=carla_sensor_kit_description
      sensor_mapping_file:=/autoware_config/sensor_mapping.yaml
    restart: on-failure

  carla-map-loader:
    image: ${SIMULATOR_IMAGE:?set by the openadkit CLI}
    container_name: ${CARLA_MAP_LOADER_CONTAINER}
    network_mode: host
    init: true
    ipc: host
    environment:
      - CARLA_RPC_HOST=${CARLA_RPC_HOST}
      - CARLA_RPC_PORT=${CARLA_RPC_PORT}
      - CARLA_WORLD=${CARLA_WORLD}
      - CARLA_LOAD_TIMEOUT=${CARLA_LOAD_TIMEOUT}
    volumes:
      - ./scripts/load-carla-map.py:/autoware_config/load-carla-map.py:ro
    depends_on:
      carla:
        condition: service_healthy
    command: python3 /autoware_config/load-carla-map.py
    restart: "no"
